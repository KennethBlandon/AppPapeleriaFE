<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"/>
<title>PIH - Iniciar Sesión</title>
<script src="./vendor/tailwindcss.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="./js/login.tailwind.config.js"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar Component -->
<header class="bg-surface dark:bg-slate-950 flex justify-between items-center w-full px-8 py-4 fixed top-0 z-50">
<div class="flex items-center gap-2">
<span class="text-xl font-bold font-manrope tracking-tight text-primary dark:text-blue-400">PIH</span>
</div>
<nav class="hidden md:flex gap-8">
</nav>
</header>
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4">
<!-- Login Container -->
<div class="z-10 w-full max-w-[500px] bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden border border-outline-variant/20">
<!-- Login Form -->
<div class="p-8 md:p-12 flex flex-col justify-center">
<div class="mb-10 text-center">
<h1 class="font-display text-3xl font-extrabold text-on-surface tracking-tight mb-2">Bienvenido de nuevo</h1>
<p class="text-on-surface-variant font-body text-sm">Ingrese sus credenciales para acceder al sistema.</p>
</div>
<form class="space-y-6" id="loginForm">
<!-- Mensaje de error -->
<div id="errorMessage" class="hidden bg-error-container text-on-error-container px-4 py-3 rounded-lg text-sm text-center border border-error/20"></div>
<!-- Input Usuario -->
<div class="space-y-1">
<label class="block text-[0.6875rem] font-semibold text-secondary uppercase tracking-wider" for="email">Usuario</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-0 border-b-2 border-primary/20 focus:border-primary focus:ring-0 px-4 py-3 rounded-t-lg transition-all text-on-surface placeholder:text-outline/50" id="email" placeholder="Ingrese su usuario" type="text" required/>
</div>
</div>
<!-- Input Password -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="block text-[0.6875rem] font-semibold text-secondary uppercase tracking-wider" for="password">Contraseña</label>

</div>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-0 border-b-2 border-primary/20 focus:border-primary focus:ring-0 px-4 py-3 rounded-t-lg transition-all text-on-surface placeholder:text-outline/50" id="password" placeholder="••••••••••••" type="password" required/>
</div>
</div>
<div class="flex items-center gap-3 py-2">
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-semibold py-4 rounded-full shadow-md hover:opacity-90 transition-all flex justify-center items-center gap-2 group" type="submit" id="submitBtn">
                        Iniciar Sesión
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>

<div class="mt-12 pt-8 border-t border-outline-variant/15 text-center">
<p id="serverInfo" class="text-[0.6875rem] text-secondary"></p>
</div>
</div>
</div>
</main>
<!-- Footer Component -->
<footer class="bg-surface dark:bg-slate-950 border-t border-outline-variant/15 flex flex-col md:flex-row justify-between items-center w-full px-8 py-6 gap-4 mt-auto">
<div class="flex flex-col md:flex-row items-center gap-4">
<span class="text-sm font-semibold text-secondary">PIH</span>
<span class="text-[0.6875rem] text-secondary dark:text-slate-500">© 2026 PIH. Todos los derechos reservados.</span>
</div>
<div class="flex gap-6">
</div>
</footer>
<script src="./js/session.js"></script>
<script src="./js/api.js"></script>
<script src="./js/login.js"></script>
<script src="./js/updates.js"></script>
</body></html>
